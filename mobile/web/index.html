<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SurePesa: send money, pay merchants and pay online with virtual cards.">
  <meta name="theme-color" content="#FBF7F3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SurePesa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SurePesa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start the big downloads while the HTML is still parsing, instead of after the
       bootstrap script runs: the app bundle, and connections to where the graphics engine
       (CanvasKit) and the fonts come from. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <style>
    html, body { margin: 0; height: 100%; background: #FBF7F3; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      font: 600 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #5A4A3F;
      transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    #boot.done { opacity: 0; pointer-events: none; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: #1D140E; letter-spacing: -0.3px; }
    .mark {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-size: 21px;
      background: linear-gradient(135deg, #E03A1E, #F57C12);
    }
    .bar { width: 160px; height: 4px; border-radius: 2px; background: #F3EBE4; overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #D9480F; animation: slide 1.1s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: 0.5; } }
    #slow { visibility: hidden; font-size: 13px; color: #7A6A5E; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="brand"><span class="mark" aria-hidden="true">S</span>SurePesa</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div id="slow">Loading securely. This takes a few seconds on the first visit.</div>
  </div>
  <script>
    var slowTimer = setTimeout(function () {
      var s = document.getElementById('slow'); if (s) s.style.visibility = 'visible';
    }, 2500);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowTimer);
      var b = document.getElementById('boot');
      if (!b) return;
      b.classList.add('done');
      setTimeout(function () { b.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
