name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surepesa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d surepesa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surepesa?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/surepesa?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed test database
        run: npx prisma db seed
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build backend
        run: npm run build
